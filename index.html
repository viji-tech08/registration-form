
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registration Form</title>
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
</head>
<body>

    <div class="container">
        <form id="registrationForm" novalidate>
            <h1>Create Account</h1>
            <p class="subtitle">Register to get started</p>

            <div class="form-group">
                
                <label for="name">Full Name</label>
                <input type="text" id="name" placeholder="Enter your name" autocomplete="name">
                <small class="error" id="nameError"></small>
            </div>

            <div class="form-group">
                <label for="email">Email Address</label>
                <input type="email" id="email" placeholder="Enter your email" autocomplete="email">
                <small class="error" id="emailError"></small>
            </div>

            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" id="password" placeholder="Minimum 6 characters" autocomplete="new-password">
                <small class="error" id="passwordError"></small>
            </div>

            <button type="submit" id="submitBtn" disabled>
                Register
            </button>

            <p id="successMessage" role="status"></p>
        </form>
    </div>

</body>
</html>
